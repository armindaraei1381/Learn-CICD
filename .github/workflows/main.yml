
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        run: |
          git clone https://github.com/armindaraei1381/Learn-CICD.git
          mv Session-2/{.,}* .
          
      - name: Install Python and Pip
        run: sudo apt-get update && sudo apt-get install -y python3.12 pip
        
      - name: Install depencies
        run: pip install -r requirements.txt

      - name: Run Test
        run: pytest test.py
